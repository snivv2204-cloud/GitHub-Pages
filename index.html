<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>AIBABA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #08090f;
  --surface: #10121c;
  --surface2:#181a28;
  --border:  #252840;
  --blue:    #4fc3f7;
  --purple:  #7b52d4;
  --glow:    #3d5afe;
  --text:    #eeeef5;
  --muted:   #5a5c78;
  --badge:   #2ecc71;
  --btn:     linear-gradient(135deg,#3d5afe 0%,#7b52d4 50%,#4fc3f7 100%);
  --btn-sm:  linear-gradient(135deg,#3d5afe,#7b52d4);
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:250px;background:radial-gradient(ellipse at 50% -10%,rgba(61,90,254,.15) 0%,transparent 70%);pointer-events:none;z-index:0}

/* HEADER */
.header{position:sticky;top:0;z-index:100;background:rgba(8,9,15,.93);backdrop-filter:blur(18px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{width:32px;height:32px;background:var(--btn);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 0 14px rgba(79,195,247,.3)}
.logo-text{font-size:20px;font-weight:800;letter-spacing:1px;background:linear-gradient(135deg,#4fc3f7,#a78bfa,#e0aaff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.balance-pill{display:flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--blue)}
.balance-pill::before{content:'⬡';font-size:10px}

/* MAIN */
.main{position:relative;z-index:1;padding:16px 0 100px}

/* SECTION */
.section{margin-bottom:24px}
.section-title{font-size:20px;font-weight:800;padding:0 16px 10px;color:var(--text)}

/* CARDS ROW */
.cards-row{display:flex;gap:10px;padding:0 16px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cards-row::-webkit-scrollbar{display:none}

/* CARD */
.card{flex:0 0 152px;scroll-snap-align:start;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;position:relative;transition:border-color .2s,transform .15s;animation:fadeUp .4s ease both}

/* Image 3:4 */
.card-img{position:relative;width:100%;padding-top:125%;overflow:hidden;background:var(--surface2);cursor:pointer}
.card-img::after{content:'';position:absolute;bottom:0;left:0;right:0;height:52%;background:linear-gradient(to top,var(--surface) 0%,transparent 100%);pointer-events:none;z-index:1}

.badge{position:absolute;top:8px;left:8px;background:var(--badge);color:#fff;font-size:9px;font-weight:800;letter-spacing:1px;padding:2px 7px;border-radius:5px;text-transform:uppercase;z-index:3}

/* Card inner slider */
.card-slides{position:absolute;inset:0;display:flex;transition:transform .28s cubic-bezier(.25,.46,.45,.94)}
.card-slide{flex:0 0 100%;height:100%}
.card-slide img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}

/* Dots on card */
.card-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:2;pointer-events:none}
.cdot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.35);transition:background .2s,transform .2s}
.cdot.on{background:#fff;transform:scale(1.3)}

/* Card bottom */
.card-bottom{padding:8px 10px 10px}
.card-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Small create button */
.btn-sm{width:100%;padding:7px 0;border:none;border-radius:8px;background:var(--btn-sm);color:#fff;font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;letter-spacing:.3px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s;box-shadow:0 2px 10px rgba(61,90,254,.35)}
.btn-sm:active{transform:scale(0.97)}
.btn-sm::after{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);animation:shimmer 2.5s infinite}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .22s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal-sheet{position:relative;flex:1;display:flex;flex-direction:column;transform:translateY(40px);transition:transform .3s cubic-bezier(.34,1.4,.64,1)}
.modal-bg.open .modal-sheet{transform:translateY(0)}

.modal-img-wrap{flex:1;position:relative;overflow:hidden;background:var(--bg)}
.modal-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:center top}
.modal-img-wrap::after{content:'';position:absolute;bottom:0;left:0;right:0;height:35%;background:linear-gradient(to top,var(--bg),transparent);pointer-events:none}

.modal-counter{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:14px;z-index:5}
.modal-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:none;color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;transition:background .18s}
.modal-close:active{background:rgba(255,255,255,.15)}

.modal-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:5}
.mdot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);transition:background .2s,transform .2s;cursor:pointer}
.mdot.on{background:#fff;transform:scale(1.25)}

.modal-foot{background:var(--bg);padding:14px 16px 28px;border-top:1px solid var(--border)}
.modal-style-name{font-size:22px;font-weight:800;margin-bottom:12px}

.btn-generate{width:100%;padding:15px;border:none;border-radius:13px;background:var(--btn);color:#fff;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;letter-spacing:.5px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(61,90,254,.4);transition:transform .15s}
.btn-generate:active{transform:scale(0.98)}
.btn-generate::after{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);animation:shimmer 3s infinite}
.btn-generate span{position:relative;z-index:1}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:150;background:rgba(8,9,15,.95);backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 14px;border-radius:10px}
.nav-btn.active .nav-ico,.nav-btn.active .nav-lbl{color:var(--blue)}
.nav-ico{font-size:19px;color:var(--muted);transition:color .2s}
.nav-lbl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.3px;transition:color .2s}

@keyframes shimmer{0%{left:-80%}100%{left:160%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">✦</div>
    <div class="logo-text">aibaba</div>
  </div>
  <div class="balance-pill" id="balancePill">3 генерации</div>
</div>

<div class="main" id="main"></div>

<div class="bottom-nav">
  <div class="nav-btn active"><div class="nav-ico">✦</div><div class="nav-lbl">Стили</div></div>
  <div class="nav-btn"><div class="nav-ico">🖼</div><div class="nav-lbl">Мои фото</div></div>
  <div class="nav-btn"><div class="nav-ico">⬡</div><div class="nav-lbl">Баланс</div></div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal-sheet">
    <div class="modal-img-wrap">
      <img id="mImg" src="" alt="">
      <div class="modal-counter" id="mCounter">1 / 3</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-dots" id="mDots"></div>
    </div>
    <div class="modal-foot">
      <div class="modal-style-name" id="mName"></div>
      <button class="btn-generate" onclick="doGenerate()">
        <span>✦ Сгенерировать (1 кадр)</span>
      </button>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.enableClosingConfirmation();

const GKEYS = ['male','female','couple'];

const STYLES = [
  {id:'biz_office',sec:'Бизнес',name:'Деловой офис',badge:true,
   imgs:['https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=500&q=80','https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=500&q=80','https://images.unsplash.com/photo-1600880292203-757bb62b4baf?w=500&q=80']},
  {id:'biz_city',sec:'Бизнес',name:'Город & карьера',
   imgs:['https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=500&q=80','https://images.unsplash.com/photo-1594744803329-e58b31de8bf5?w=500&q=80','https://images.unsplash.com/photo-1521737852567-6949f3f9f2b5?w=500&q=80']},
  {id:'biz_conf',sec:'Бизнес',name:'Конференция',
   imgs:['https://images.unsplash.com/photo-1560250097-0b93528c311a?w=500&q=80','https://images.unsplash.com/photo-1551836022-d5d88e9218df?w=500&q=80','https://images.unsplash.com/photo-1556761175-b413da4baf72?w=500&q=80']},
  {id:'lux_night',sec:'Люкс',name:'Ночной кэжуал',badge:true,
   imgs:['https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=500&q=80','https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=500&q=80','https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=500&q=80']},
  {id:'lux_prem',sec:'Люкс',name:'Премиум',
   imgs:['https://images.unsplash.com/photo-1519741497674-611481863552?w=500&q=80','https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=500&q=80','https://images.unsplash.com/photo-1516685018646-549198525c1b?w=500&q=80']},
  {id:'str_day',sec:'Street',name:'Уличный день',
   imgs:['https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=500&q=80','https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=500&q=80','https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=500&q=80']},
  {id:'str_art',sec:'Street',name:'Граффити',badge:true,
   imgs:['https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=500&q=80','https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=500&q=80','https://images.unsplash.com/photo-1488716820095-cbe80883c496?w=500&q=80']},
  {id:'nat_forest',sec:'Природа',name:'Лесная прогулка',
   imgs:['https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500&q=80','https://images.unsplash.com/photo-1542596768-5d1d21f1cf98?w=500&q=80','https://images.unsplash.com/photo-1504275107627-0c2ba7a43dba?w=500&q=80']},
  {id:'nat_ocean',sec:'Природа',name:'Океан & закат',
   imgs:['https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500&q=80','https://images.unsplash.com/photo-1509967419530-da38b4704bc6?w=500&q=80','https://images.unsplash.com/photo-1530053969600-caed2596d242?w=500&q=80']},
  {id:'hol_ny',sec:'Праздники',name:'Новый год',badge:true,
   imgs:['https://images.unsplash.com/photo-1512389142860-9c449e58a543?w=500&q=80','https://images.unsplash.com/photo-1512678080530-7760d81faba6?w=500&q=80','https://images.unsplash.com/photo-1576919228236-a097c32a5cd4?w=500&q=80']},
  {id:'hol_bday',sec:'Праздники',name:'День рождения',
   imgs:['https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?w=500&q=80','https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=500&q=80','https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=500&q=80']},
];

const cardG = {};
STYLES.forEach(s => cardG[s.id] = 0);
let mStyle = null, mGIdx = 0;

// ── BUILD ──
function build() {
  const secs = {};
  STYLES.forEach(s => { (secs[s.sec] = secs[s.sec]||[]).push(s); });
  const main = document.getElementById('main');
  Object.entries(secs).forEach(([title, list]) => {
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `<div class="section-title">${title}</div>`;
    const row = document.createElement('div');
    row.className = 'cards-row';
    list.forEach(s => row.appendChild(makeCard(s)));
    sec.appendChild(row);
    main.appendChild(sec);
  });
}

function makeCard(s) {
  const d = document.createElement('div');
  d.className = 'card';
  const slides = s.imgs.map(url =>
    `<div class="card-slide"><img src="${url}" loading="lazy" alt=""></div>`
  ).join('');
  const dots = s.imgs.map((_,i) =>
    `<div class="cdot${i===0?' on':''}"></div>`
  ).join('');
  d.innerHTML = `
    <div class="card-img" onclick="openModal('${s.id}')">
      ${s.badge?'<span class="badge">НОВОЕ</span>':''}
      <div class="card-slides" id="cs-${s.id}">${slides}</div>
      <div class="card-dots" id="cd-${s.id}">${dots}</div>
    </div>
    <div class="card-bottom">
      <div class="card-name">${s.name}</div>
      <button class="btn-sm" onclick="event.stopPropagation();quickGen('${s.id}')">✦ Создать</button>
    </div>`;

  // свайп на карточке
  const img = d.querySelector('.card-img');
  let tx = 0;
  img.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
  img.addEventListener('touchend', e => {
    const diff = tx - e.changedTouches[0].clientX;
    if(Math.abs(diff) > 30) {
      e.stopPropagation();
      const cur = cardG[s.id];
      const next = diff > 0 ? Math.min(cur+1, s.imgs.length-1) : Math.max(cur-1, 0);
      if(next !== cur) setCardSlide(s.id, next);
    }
  }, {passive:true});

  return d;
}

function setCardSlide(id, idx) {
  cardG[id] = idx;
  const sl = document.getElementById('cs-'+id);
  const dt = document.getElementById('cd-'+id);
  if(sl) sl.style.transform = `translateX(-${idx*100}%)`;
  if(dt) dt.querySelectorAll('.cdot').forEach((d,i) => d.classList.toggle('on', i===idx));
}

function quickGen(id) {
  send(STYLES.find(x=>x.id===id), cardG[id]);
}

// ── MODAL ──
function openModal(id) {
  mStyle = STYLES.find(x=>x.id===id);
  mGIdx = cardG[id];
  document.getElementById('mName').textContent = mStyle.name;
  document.getElementById('mDots').innerHTML =
    mStyle.imgs.map((_,i) => `<div class="mdot${i===mGIdx?' on':''}" onclick="swMG(${i})"></div>`).join('');
  refreshModal();
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function swMG(idx) {
  mGIdx = idx;
  document.querySelectorAll('.mdot').forEach((b,i) => b.classList.toggle('on', i===idx));
  setCardSlide(mStyle.id, idx);
  refreshModal();
}

function refreshModal() {
  document.getElementById('mImg').src = mStyle.imgs[mGIdx];
  document.getElementById('mCounter').textContent = `${mGIdx+1} / ${mStyle.imgs.length}`;
}

// свайп в модалке
let mTx = 0;
document.getElementById('modal').addEventListener('touchstart', e => { mTx = e.touches[0].clientX; }, {passive:true});
document.getElementById('modal').addEventListener('touchend', e => {
  const diff = mTx - e.changedTouches[0].clientX;
  if(Math.abs(diff) > 40 && mStyle) {
    const next = diff > 0 ? Math.min(mGIdx+1, mStyle.imgs.length-1) : Math.max(mGIdx-1, 0);
    if(next !== mGIdx) swMG(next);
  }
}, {passive:true});

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

function doGenerate() {
  if(!mStyle) return;
  send(mStyle, mGIdx);
  closeModal();
}

function send(style, gIdx) {
  tg.sendData(JSON.stringify({
    style_id: style.id,
    style_name: style.name,
    section: style.sec,
    gender: GKEYS[gIdx],
  }));
}

build();
</script>
</body>
</html>
